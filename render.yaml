# Render.com deployment configuration
# Paste this at https://dashboard.render.com → New Web Service → From YAML

services:
  - type: web
    name: rainwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    autoDeploy: true
